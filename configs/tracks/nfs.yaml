# C13 track for the live demo: NFStream statistical features (configs/nfstream.yaml, frozen) of the CIC-2017 PCAPs
# (nfs17, training) and one CSE-CIC-IDS2018 day (nfs18, the "different network" replay segment).
# flow_id, addresses, src_port and timestamps are identifiers and are not listed. dst_port is kept but flagged.
datasets: [nfs17, nfs18]
flagged: [dst_port]
features: [dst_port, ip_prot, bidirectional_duration_ms, bidirectional_packets, bidirectional_bytes, src2dst_duration_ms,
  src2dst_packets, src2dst_bytes, dst2src_duration_ms, dst2src_packets, dst2src_bytes, bidirectional_min_ps,
  bidirectional_mean_ps, bidirectional_stddev_ps, bidirectional_max_ps, src2dst_min_ps, src2dst_mean_ps,
  src2dst_stddev_ps, src2dst_max_ps, dst2src_min_ps, dst2src_mean_ps, dst2src_stddev_ps, dst2src_max_ps,
  bidirectional_min_piat_ms, bidirectional_mean_piat_ms, bidirectional_stddev_piat_ms, bidirectional_max_piat_ms,
  src2dst_min_piat_ms, src2dst_mean_piat_ms, src2dst_stddev_piat_ms, src2dst_max_piat_ms, dst2src_min_piat_ms,
  dst2src_mean_piat_ms, dst2src_stddev_piat_ms, dst2src_max_piat_ms, bidirectional_syn_packets,
  bidirectional_cwr_packets, bidirectional_ece_packets, bidirectional_urg_packets, bidirectional_ack_packets,
  bidirectional_psh_packets, bidirectional_rst_packets, bidirectional_fin_packets, src2dst_syn_packets,
  src2dst_cwr_packets, src2dst_ece_packets, src2dst_urg_packets, src2dst_ack_packets, src2dst_psh_packets,
  src2dst_rst_packets, src2dst_fin_packets, dst2src_syn_packets, dst2src_cwr_packets, dst2src_ece_packets,
  dst2src_urg_packets, dst2src_ack_packets, dst2src_psh_packets, dst2src_rst_packets, dst2src_fin_packets]
