services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./models:/app/models", "./data:/app/data"]
  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    environment: {API_URL: "http://api:8000"}
    volumes: ["./data:/app/data"]
    depends_on: [api]
